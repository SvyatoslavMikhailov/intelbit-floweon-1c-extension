name: BSL Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bsl-lint:
    runs-on: ubuntu-latest
    # TODO: подключить bsl-language-server после релиза v0.1.0
    # Сейчас — placeholder, проверяем только валидность XML-файлов
    steps:
      - uses: actions/checkout@v4

      # xmllint нет в образе ubuntu-latest — шаг ниже падал с «xmllint: command not found»
      # (main красный с 29.05.2026), сами XML валидны.
      - name: Install xmllint
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils

      - name: Validate XML files
        run: |
          find src -name "*.xml" | while read -r f; do
            xmllint --noout "$f" || exit 1
          done
          echo "All XML files valid"
